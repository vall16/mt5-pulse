Per **XAUUSD (oro)** non c’è una regola “fissa”, ma **una proporzione sana tra Stop Loss (SL/SP) e Take Profit (TP)** sì. In pratica dipende da **timeframe, volatilità e stile**, però ci sono **linee guida usate dai trader sull’oro**.

---

## Regola base (Risk/Reward)

👉 **TP ≥ 1.5× – 3× lo SL**

| SL (SP)   | TP consigliato |
| --------- | -------------- |
| 100 punti | 150–300 punti  |
| 200 punti | 300–600 punti  |
| 300 punti | 450–900 punti  |

➡️ **Mai TP più piccolo dello SL**, su XAUUSD è quasi sempre perdente nel medio periodo.

---

## Perché sull’oro serve SL relativamente stretto

XAUUSD:

* ha **spike improvvisi**
* è **molto manipolato su news**
* spesso fa **false rotture**

Quindi:

* SL **troppo largo** → drawdown inutile
* SL **troppo stretto** → stop hunt

