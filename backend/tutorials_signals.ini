
## 🎯 Scopo della `check_signal`

La funzione **check_signal** serve a:
👉 **decidere se aprire un BUY, un SELL oppure restare in HOLD**
👉 **sul simbolo scelto (es. XAUUSD)**
👉 **sull’account SLAVE**
👉 **in modo automatico e sicuro (niente doppie posizioni o hedge)**

---

## 🧠 Cosa fa, in ordine logico

### 1️⃣ Pulisce i log e blocca concorrenza

* Cancella i log precedenti
* Usa un **lock** per evitare che due segnali partano insieme

👉 Garantisce che **un solo segnale venga valutato alla volta**

---

### 2️⃣ Recupera le info del trader

* Prende il **trader corrente**
* Ricava **IP e porta dello SLAVE**
* Costruisce `BASE_URL_SLAVE`

👉 Serve per sapere **dove leggere i dati e dove inviare gli ordini**

---

### 3️⃣ Recupera i dati di mercato

* Chiede allo SLAVE le **ultime N candele**
* Timeframe = quello impostato (es. M5)
* Se non arrivano dati → **esce subito**

👉 Senza dati affidabili **non prende decisioni**

---

### 4️⃣ Calcola gli indicatori

Usa solo indicatori **semplici e veloci**:

* **EMA corta**
* **EMA lunga**
* **RSI**

👉 Questa è una strategia **trend + momentum**

---

### 5️⃣ Decide il segnale teorico

Definisce due condizioni:

#### 📈 BUY se:

* EMA corta > EMA lunga (**trend rialzista**)
* RSI < 68 (**non ipercomprato**)

#### 📉 SELL se:

* EMA corta < EMA lunga (**trend ribassista**)
* RSI > 32 (**non ipervenduto**)

Se nessuna delle due → **HOLD**

---

### 6️⃣ Controlla cosa è già aperto sullo SLAVE

* Chiede allo SLAVE tutte le **posizioni aperte**
* Verifica:

  * se esiste già un BUY
  * se esiste già un SELL

👉 Serve a **non fare errori operativi**

---

### 7️⃣ Se il segnale è BUY

Succede solo se:

* La condizione BUY è vera
* ❌ NON esiste già un BUY
* ❌ NON esiste una SELL (niente hedge)

Se tutto ok:
➡️ **manda un BUY allo SLAVE**
➡️ aggiorna `previous_signal`

---

### 8️⃣ Se il segnale è SELL

Succede solo se:

* La condizione SELL è vera
* ❌ NON esiste già una SELL
* ❌ NON esiste un BUY

Se tutto ok:
➡️ **manda un SELL allo SLAVE**
➡️ aggiorna `previous_signal`

---

### 9️⃣ Se non c’è segnale → HOLD

* Imposta `current_signal = HOLD`
* Logga lo stato

⚠️ Nota importante:

* **NON chiude automaticamente le posizioni**
* Il codice di chiusura è **commentato**

👉 Questo rende la strategia **conservativa**
👉 Evita chiusure premature

---

## 🔁 Gestione stato (molto importante)

La funzione usa:

* `previous_signal`
* `current_signal`

Questo serve per:

* sapere **da dove arriva**
* evitare ripetizioni inutili
* decidere se in futuro **chiudere o mantenere**

---

## 🧩 In una frase

**check_signal** è una strategia base che:

> legge il mercato → decide BUY/SELL/HOLD → controlla che lo SLAVE sia coerente → apre una sola posizione alla volta → evita hedge e doppioni


